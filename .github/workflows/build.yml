name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Unzip project
        run: unzip -q the-wolf-mod.zip
      - name: Build
        run: cd the-wolf-mod && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: the-wolf-jar
          path: the-wolf-mod/build/libs/*.jar
